[package]
name = "waimea-desktop"
version = "0.3.7"
edition = "2021"
description = "Waimea as a desktop app: a music and video player with radio, YouTube and Winamp skins"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
waimea = { path = ".." }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
